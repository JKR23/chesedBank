spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate #Tells Hibernate to validate the schema against the database

    show-sql: true
    properties:
      hibernate:
        format-sql: true

    flyway:
        enabled: true #Enable Flyway migrations
        locations: classpath:db/migration #Location of migration scripts
